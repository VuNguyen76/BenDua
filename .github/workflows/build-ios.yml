name: Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile and Package iOS IPA
        run: |
          mkdir -p Payload/BenDua.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iOS SDK: $SDK_PATH"
          swiftc -target arm64-apple-ios15.0 -sdk "$SDK_PATH" -O ios/main.swift -o Payload/BenDua.app/BenDua
          cp ios/Info.plist Payload/BenDua.app/Info.plist
          cp icon.png Payload/BenDua.app/AppIcon60x60@2x.png
          cp icon.png Payload/BenDua.app/AppIcon76x76@2x~ipad.png
          
          # Ad-hoc sign bundle
          codesign -s - --force --deep Payload/BenDua.app || true
          
          zip -r -9 BenDua.ipa Payload
          echo "Successfully created BenDua.ipa!"
          ls -lh BenDua.ipa

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BenDua-ipa
          path: BenDua.ipa

      - name: Upload IPA to Release v1.0.0
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          files: BenDua.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
